<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A fast and minimal weather application providing real-time forecasts and current conditions for any city."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Weather App</title>
  </head>
  <body class="font-primary bg-[linear-gradient(135deg,#fbc2eb_0%,#a6c1ee_100%)] p-4.5 lg:h-dvh">
    <div class="grid h-full grid-cols-1 items-start gap-10 lg:grid-cols-[1fr_3fr] lg:gap-2.5">
      <div class="flex h-full flex-col justify-between">
        <!-- Search Form -->
        <form
          id="search-form"
          action=""
          autocomplete="off"
          spellcheck="false"
          class="flex items-center gap-2.5 rounded-2xl bg-white p-3 text-white lg:mb-8"
        >
          <input
            id="search-input"
            type="text"
            placeholder="Search for a city..."
            class="text-text-primary placeholder:text-text-secondary mr-auto h-full max-w-[60%] flex-1 px-3 font-medium md:mr-0 md:max-w-none"
          />

          <button
            class="bg-primary flex size-12 shrink-0 items-center justify-center rounded-2xl transition-transform duration-150 hover:opacity-80 active:scale-110"
            type="submit"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>

          <button
            id="location-btn"
            class="bg-primary flex size-12 shrink-0 items-center justify-center rounded-2xl transition-transform duration-150 hover:opacity-80 active:scale-110"
            type="button"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v20M2 12h20"></path>
              <circle cx="12" cy="12" r="7"></circle>
            </svg>
          </button>
        </form>

        <!-- Author -->
        <div data-role="footer-text" class="text-text-primary hidden font-medium lg:block">
          <p>
            Made with ❤️ by
            <a
              href="https://github.com/QuocThinh2312"
              target="_blank"
              class="bg-[linear-gradient(90deg,#a855f7,#ec4899,#fbbf24)] bg-size-[200%_auto] bg-clip-text font-semibold text-transparent transition-[background-position] duration-150 ease-in hover:bg-bottom"
            >
              Quang Zõ
            </a>
          </p>
          <span class="opacity-70">Copyright © 2026</span>
        </div>
      </div>

      <!-- Weather Display -->
      <main class="size-full">
        <div id="weather-skeleton" class="animate-pulse space-y-3">
          <article class="flex w-full items-center rounded-2xl bg-white p-6 shadow-2xl">
            <section class="flex flex-1 flex-col items-center">
              <div class="mb-5 h-8 w-48 rounded-lg bg-slate-200 md:h-9"></div>
              <div class="mb-5 size-40 rounded-full bg-slate-200"></div>
              <div class="mb-4 h-8 w-32 rounded-2xl bg-slate-200 md:h-24 md:w-56"></div>
              <div class="mb-2 h-8 w-44 rounded-lg bg-slate-200"></div>
              <div class="h-5 w-48 rounded-md bg-slate-200 md:h-6"></div>
            </section>

            <ul class="flex flex-1 flex-wrap justify-center gap-6">
              <li class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm">
                <div class="mb-2.5 size-20 rounded-2xl bg-slate-200"></div>
                <div class="mb-1.5 h-3.5 w-20 rounded bg-slate-200"></div>
                <div class="h-5 w-14 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm">
                <div class="mb-2.5 size-20 rounded-2xl bg-slate-200"></div>
                <div class="mb-1.5 h-3.5 w-20 rounded bg-slate-200"></div>
                <div class="h-5 w-14 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm">
                <div class="mb-2.5 size-20 rounded-2xl bg-slate-200"></div>
                <div class="mb-1.5 h-3.5 w-20 rounded bg-slate-200"></div>
                <div class="h-5 w-14 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm">
                <div class="mb-2.5 size-20 rounded-2xl bg-slate-200"></div>
                <div class="mb-1.5 h-3.5 w-20 rounded bg-slate-200"></div>
                <div class="h-5 w-14 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm">
                <div class="mb-2.5 size-20 rounded-2xl bg-slate-200"></div>
                <div class="mb-1.5 h-3.5 w-20 rounded bg-slate-200"></div>
                <div class="h-5 w-14 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm">
                <div class="mb-2.5 size-20 rounded-2xl bg-slate-200"></div>
                <div class="mb-1.5 h-3.5 w-24 rounded bg-slate-200"></div>
                <div class="h-5 w-14 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm">
                <div class="mb-2.5 size-20 rounded-2xl bg-slate-200"></div>
                <div class="mb-1.5 h-3.5 w-28 rounded bg-slate-200"></div>
                <div class="h-5 w-14 rounded bg-slate-200"></div>
              </li>
            </ul>
          </article>

          <section class="flex w-full flex-col items-center gap-2.5 rounded-2xl bg-white p-6 shadow-2xl">
            <div class="h-8 w-44 rounded-lg bg-slate-200"></div>

            <ul class="grid w-full grid-cols-3 items-center gap-6">
              <li class="flex flex-col items-center justify-center gap-2.5 rounded-2xl bg-white p-6 shadow-md">
                <div class="h-5 w-16 rounded bg-slate-200"></div>
                <div class="size-20 rounded-full bg-slate-200"></div>
                <div class="h-9 w-24 rounded-lg bg-slate-200"></div>
                <div class="h-5 w-28 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center gap-2.5 rounded-2xl bg-white p-6 shadow-md">
                <div class="h-5 w-24 rounded bg-slate-200"></div>
                <div class="size-20 rounded-full bg-slate-200"></div>
                <div class="h-9 w-24 rounded-lg bg-slate-200"></div>
                <div class="h-5 w-28 rounded bg-slate-200"></div>
              </li>
              <li class="flex flex-col items-center justify-center gap-2.5 rounded-2xl bg-white p-6 shadow-md">
                <div class="h-5 w-20 rounded bg-slate-200"></div>
                <div class="size-20 rounded-full bg-slate-200"></div>
                <div class="h-9 w-24 rounded-lg bg-slate-200"></div>
                <div class="h-5 w-28 rounded bg-slate-200"></div>
              </li>
            </ul>
          </section>
        </div>

        <div id="weather-content" class="hidden h-full space-y-3 md:flex md:flex-col">
          <article
            class="flex flex-col items-center gap-10 rounded-2xl bg-white p-12 shadow-2xl lg:flex-row lg:gap-0 lg:p-6"
          >
            <section class="flex flex-1 flex-col items-center text-center">
              <h1 id="location-name" class="text-text-primary mb-5 text-2xl font-bold tracking-tight sm:text-3xl"></h1>

              <img id="weather-icon" src="/icons/weather/sunny-day.svg" alt="" class="mb-5 size-40 object-contain" />

              <span id="current-temp" class="text-primary mb-4 text-5xl font-extrabold tracking-wide md:text-8xl">
              </span>

              <h2 id="weather-description" class="text-text-primary mb-2 text-2xl font-bold tracking-tight"></h2>

              <p class="text-text-secondary text-sm font-semibold md:text-base">
                Min: <span id="min-temp"></span>, Max:
                <span id="max-temp"></span>
              </p>
            </section>

            <ul
              class="grid grid-cols-2 gap-6 text-center font-bold sm:grid-cols-3 md:flex md:flex-1 md:flex-wrap md:justify-center"
            >
              <li
                class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm transition-transform hover:scale-105"
              >
                <img src="/icons/humidity.svg" alt="" class="mb-2.5 size-20" />
                <h3 class="text-text-secondary mb-1 text-xs tracking-widest uppercase">Humidity</h3>
                <p id="humidity" class="text-base text-slate-700"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm transition-transform hover:scale-105"
              >
                <img src="/icons/wind.svg" alt="" class="mb-2.5 size-20" />
                <h3 class="text-text-secondary mb-1 text-xs tracking-widest uppercase">Wind Speed</h3>
                <p id="wind-speed" class="text-base text-slate-700"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm transition-transform hover:scale-105"
              >
                <img src="/icons/thermometer-celsius.svg" alt="" class="mb-2.5 size-20" />
                <h3 class="text-text-secondary mb-1 text-xs tracking-widest uppercase">Feels Like</h3>
                <p id="feels-like" class="text-base text-slate-700"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm transition-transform hover:scale-105"
              >
                <img src="/icons/pressure.svg" alt="" class="mb-2.5 size-20" />
                <h3 class="text-text-secondary mb-1 text-xs tracking-widest uppercase">Pressure</h3>
                <p id="pressure" class="text-base text-slate-700"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm transition-transform hover:scale-105"
              >
                <img src="/icons/visibility.svg" alt="" class="mb-2.5 size-20" />
                <h3 class="text-text-secondary mb-1 text-xs tracking-widest uppercase">Visibility</h3>
                <p id="visibility" class="text-base text-slate-700"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm transition-transform hover:scale-105"
              >
                <img src="/icons/uv-index.svg" alt="" class="mb-2.5 size-20" />
                <h3 class="text-text-secondary mb-1 text-xs tracking-widest uppercase">UV INDEX</h3>
                <p id="uv-index" class="text-base text-slate-700"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center rounded-2xl bg-white p-3 shadow-sm transition-transform hover:scale-105"
              >
                <img src="/icons/rain.svg" alt="" class="mb-2.5 size-20" />
                <h3 class="text-text-secondary mb-1 text-xs tracking-widest uppercase">CHANCE OF RAIN</h3>
                <p id="chance-of-rain" class="text-base text-slate-700"></p>
              </li>
            </ul>
          </article>

          <section
            class="flex w-full flex-1 flex-col items-center justify-center gap-2.5 rounded-2xl bg-white p-6 text-center shadow-2xl"
          >
            <h2 class="text-text-primary text-2xl font-bold tracking-tight">3-Day Forecast</h2>

            <ul class="grid w-full grid-cols-1 items-center gap-6 md:grid-cols-3">
              <li
                class="flex flex-col items-center justify-center gap-2.5 rounded-2xl bg-white p-6 shadow-md transition-transform hover:-translate-y-1 hover:shadow-lg"
              >
                <h3 class="text-text-primary text-sm font-bold tracking-widest uppercase">Today</h3>

                <img id="weather-icon-today" src="/icons/weather/sunny-day.svg" alt="" class="size-20 object-contain" />

                <p id="forecast-today-temp" class="text-primary text-3xl font-extrabold tracking-tighter"></p>

                <p id="forecast-today-desc" class="text-text-secondary text-sm font-medium"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center gap-2.5 rounded-2xl bg-white p-6 shadow-md transition-transform hover:-translate-y-1 hover:shadow-lg"
              >
                <h3 class="text-text-primary text-sm font-bold tracking-widest uppercase">TOMORROW</h3>

                <img
                  id="weather-icon-tomorrow"
                  src="/icons/weather/sunny-day.svg"
                  alt=""
                  class="size-20 object-contain"
                />

                <p id="forecast-tomorrow-temp" class="text-primary text-3xl font-extrabold tracking-tighter"></p>

                <p id="forecast-tomorrow-desc" class="text-text-secondary text-sm font-medium"></p>
              </li>

              <li
                class="flex flex-col items-center justify-center gap-2.5 rounded-2xl bg-white p-6 shadow-md transition-transform hover:-translate-y-1 hover:shadow-lg"
              >
                <h3 id="forecast-day-after-day" class="text-text-primary text-sm font-bold tracking-widest uppercase">
                  TUE
                </h3>

                <img
                  id="weather-icon-day-after"
                  src="/icons/weather/sunny-day.svg"
                  alt=""
                  class="size-20 object-contain"
                />

                <p id="forecast-day-after-temp" class="text-primary text-3xl font-extrabold tracking-tighter"></p>

                <p id="forecast-day-after-desc" class="text-text-secondary text-sm font-medium"></p>
              </li>
            </ul>
          </section>
        </div>
      </main>

      <!-- Author -->
      <div data-role="footer-text" class="text-text-primary flex items-center justify-between font-medium lg:hidden">
        <p>
          Made with ❤️ by
          <a
            href="https://github.com/QuocThinh2312"
            target="_blank"
            class="bg-[linear-gradient(90deg,#a855f7,#ec4899,#fbbf24)] bg-size-[200%_auto] bg-clip-text font-semibold text-transparent transition-[background-position] duration-150 ease-in hover:bg-bottom"
          >
            Quang Zõ
          </a>
        </p>
        <span class="hidden opacity-70 sm:block">Copyright © 2026</span>
      </div>
    </div>

    <div
      id="error-modal"
      role="dialog"
      aria-modal="true"
      class="group invisible fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4 opacity-0 backdrop-blur-xs transition-all duration-300 ease-out data-open:pointer-events-auto data-open:visible data-open:opacity-100"
    >
      <div
        class="w-full max-w-sm translate-y-3 rounded-2xl bg-white p-6 text-center shadow-2xl transition-all duration-300 ease-out group-data-open:translate-y-0 group-data-open:scale-100"
      >
        <div class="mx-auto mb-4 flex size-14 items-center justify-center rounded-full bg-rose-50 text-rose-500">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>

        <h2 class="text-text-primary mb-2 text-2xl font-bold tracking-tight">Something went wrong</h2>

        <p id="error-modal-message" class="text-text-secondary text-md mb-6 leading-relaxed font-medium"></p>

        <button
          id="error-modal-close"
          class="bg-primary w-full rounded-xl py-3 font-semibold text-white transition-all duration-150 hover:opacity-85 active:scale-98"
        >
          Got it
        </button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
